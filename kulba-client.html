<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4d3c">
<title>КУЛБА — ҳисоби шумо</title>
<style>
:root{
  --pine:#1f4d3c; --pine-d:#143328; --ink:#17231e; --mute:#5d6d64;
  --page:#eef1ec; --line:#cfd8d1; --resin:#e4a43a; --rust:#a8452b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:480px;margin:0 auto}
header{background:var(--pine);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 54px}
.brand{font-size:15px;font-weight:800;letter-spacing:.14em}
.sub{font-size:13px;opacity:.72;margin-top:2px}
h1{font-size:30px;font-weight:700;line-height:1.15;margin-top:26px;letter-spacing:-.01em;word-break:break-word}
main{padding:0 16px 28px;margin-top:-34px}

/* бонус — чун бирқаи чӯбфурӯшӣ */
.tag{position:relative;background:var(--resin);color:var(--pine-d);border-radius:10px;padding:20px 22px 18px;margin-bottom:14px}
.tag::before,.tag::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--page)}
.tag::before{left:-11px}.tag::after{right:-11px}
.tag .lbl{font-size:15px;font-weight:600}
.tag .amt{font-size:52px;font-weight:800;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tag .amt small{font-size:20px;font-weight:700;margin-left:6px;letter-spacing:0}
.tag .rule{border-top:2px dashed rgba(20,51,40,.35);margin:14px -22px 12px}
.tag .note{font-size:13.5px;line-height:1.4}

.figs{display:flex;gap:10px;margin-bottom:6px}
.fig{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
.fig span{display:block;font-size:13px;color:var(--mute)}
.fig b{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.fig.debt b{color:var(--rust)}

h2{font-size:17px;font-weight:700;margin:26px 4px 6px}
.order{padding:13px 4px;border-bottom:1px solid var(--line)}
.order:last-child{border-bottom:0}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.od{font-size:14px;color:var(--mute)}
.ot{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ol{margin-top:5px;font-size:15px}
.ol div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.ol i{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:18px 4px;color:var(--mute)}

footer{padding:6px 20px 30px;font-size:13px;color:var(--mute)}
footer p+p{margin-top:8px}
footer a{color:var(--pine);font-weight:600;text-underline-offset:3px}
footer a:focus-visible{outline:3px solid var(--resin);outline-offset:3px;border-radius:3px}

.err{margin:60px 24px;font-size:17px}
.err b{display:block;font-size:22px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function grp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
  function int(n){return grp(Math.round(Number(n)||0))}
  function two(n){return grp((Math.round((Number(n)||0)*100)/100).toFixed(2))}
  function pad(n){return n<10?'0'+n:''+n}
  function dt(s){var d=new Date(s);if(isNaN(d))return '';return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', '+pad(d.getHours())+':'+pad(d.getMinutes())}

  function fail(){
    app.innerHTML='<div class="err"><b>Пайванд кушода нашуд</b>Аз мағоза пайванди нав пурсед.</div>';
  }

  var p;
  try{
    var raw=location.hash.slice(1);
    try{raw=decodeURIComponent(raw)}catch(e){}
    if(!raw)return fail();
    p=JSON.parse(decodeURIComponent(escape(atob(raw))));
    if(!p||typeof p!=='object')return fail();
  }catch(e){return fail()}

  var items=Array.isArray(p.items)?p.items:[];
  var orders=[],idx={};
  items.forEach(function(it){
    var k=it.d||'';
    if(!(k in idx)){idx[k]=orders.length;orders.push({d:k,l:[],t:0})}
    var o=orders[idx[k]];o.l.push(it);o.t+=Number(it.s)||0;
  });

  var bonus=Number(p.bonus)||0,rate=Number(p.rate)||0,debt=Number(p.debt)||0;
  var h='';
  h+='<header><div class="brand">КУЛБА</div><div class="sub">Масолеҳи сохтмонӣ</div><h1>Салом, '+esc(p.name||'мизоҷи азиз')+'</h1></header><main>';

  if(p.vip||bonus>0){
    h+='<section class="tag"><div class="lbl">Бонуси шумо</div><div class="amt">'+two(bonus)+'<small>TJS</small></div><div class="rule"></div><div class="note">'
      +(rate>0?esc(rate)+'% аз ҳар харид ба бонус илова мешавад. ':'Бо ҳар харид бонус зиёд мешавад. ')
      +'Бонусро дар мағоза гиред.</div></section>';
  }

  h+='<div class="figs"><div class="fig"><span>Ҷамъи харид</span><b>'+int(p.spent)+' TJS</b></div>';
  if(debt>0)h+='<div class="fig debt"><span>Қарз</span><b>'+int(debt)+' TJS</b></div>';
  h+='</div>';

  h+='<h2>Харидҳо</h2>';
  if(!orders.length){
    h+='<div class="empty">Харид ҳанӯз нест.</div>';
  }else{
    orders.forEach(function(o){
      h+='<div class="order"><div class="oh"><span class="od">'+esc(dt(o.d))+'</span><span class="ot">'+int(o.t)+' TJS</span></div><div class="ol">';
      o.l.forEach(function(it){
        h+='<div><span>'+esc(it.n)+'</span><i>'+esc(it.q)+' '+esc(it.u||'')+'</i></div>';
      });
      h+='</div></div>';
    });
  }

  h+='</main><footer>';
  if(p.t)h+='<p>Маълумот аз '+esc(dt(p.t))+'. Барои бонуси навтарин аз мағоза пайванди нав пурсед.</p>';
  h+='<p>Мо дар Instagram: <a href="https://instagram.com/kulba_tj" target="_blank" rel="noopener">@kulba_tj</a></p></footer>';

  app.innerHTML=h;
})();
</script>
</body>
</html>
